<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img"><title>Повторяемость чтения и копия снимка SQLite</title><desc>В испытанной учебной SQLite четыре строки дают 100. После добавления D5 на 50 новое состояние даёт 5/150. Без общего снимка смешаны 4/150; читающая транзакция WAL и проверенная копия сохраняют 4/100.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="960" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">Сохранить одно состояние</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебная SQLite WAL, два соединения</text><rect x="24" y="116" width="592" height="104" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="179" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">Исходно: 4 строки, сумма 100</text><rect x="24" y="260" width="280" height="384" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="305" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Без снимка</text><text x="44" y="370" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Количество 4</text><path d="M164 390L164 424" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="464" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Добавлена D5</text><text x="44" y="505" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Сумма +50</text><path d="M164 524L164 558" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="604" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Сумма 150</text><rect x="328" y="260" width="288" height="384" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="348" y="305" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">В транзакции</text><text x="348" y="345" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">WAL</text><text x="348" y="408" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Количество 4</text><text x="348" y="464" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">D5 у писателя</text><text x="348" y="505" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">уже добавлена</text><text x="348" y="604" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Сумма 100</text><text x="44" y="694" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Смесь: 4 / 150</text><text x="348" y="694" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Снимок: 4 / 100</text><rect x="24" y="740" width="592" height="140" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="788" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Проверенная копия: 4 / 100</text><text x="44" y="839" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Новое чтение: 5 / 150</text><text x="24" y="929" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Одинаковый SQL не фиксирует данные</text></svg>