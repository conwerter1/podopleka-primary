<svg xmlns="http://www.w3.org/2000/svg" width="640" height="862" viewBox="0 0 640 862" role="img"><title>Распределение действий и приёмка результата</title><desc>Учебный реестр для арендованной ВМ: инфраструктура у поставщика, гостевая ОС у клиента, у приложения пока нет исполнителя. Нужна отдельная приёмка каждого результата.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="862" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Три действия на границе услуги</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебная аренда виртуальной машины</text><text x="44" y="142" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Действие</text><text x="352" y="142" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Кто исполняет</text><rect x="24" y="168" width="592" height="112" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="233" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Инфраструктура</text><text x="352" y="233" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Поставщик</text><rect x="24" y="310" width="592" height="112" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="375" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Гостевая ОС</text><text x="352" y="375" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Клиент</text><rect x="24" y="452" width="592" height="112" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="517" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Приложение</text><text x="352" y="517" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Не назначен</text><path d="M320 578L320 620" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="638" width="592" height="142" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="682" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Кто принимает результат?</text><text x="44" y="728" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Нужны участник и критерий приёмки</text><text x="44" y="767" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">для каждого заданного действия</text><text x="24" y="829" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Реестр не доказывает исполнение.</text></svg>