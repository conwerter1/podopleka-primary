<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1086" viewBox="0 0 640 1086" role="img"><title>Идентичность EML, MIME-части и вложения</title><desc>Два собственных EML имеют повторённый заявленный Message-ID, разный текст и разные хеши целых файлов. Одинаковое декодированное вложение сохраняет две связи происхождения. DKIM не проверялся.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="1086" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">Одинаковый файл ≠ письмо</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Два собственных полученных EML</text><rect x="24" y="122" width="592" height="92" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="178" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Message-ID заявлен одинаковый</text><rect x="24" y="254" width="288" height="184" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="42" y="300" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">EML-A</text><text x="42" y="350" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Согласование</text><text x="42" y="402" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Хеш EML: разный</text><path d="M168 442L168 488" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="506" width="288" height="112" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="42" y="550" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Текстовая часть</text><text x="42" y="594" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Свой контекст</text><rect x="328" y="254" width="288" height="184" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="346" y="300" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">EML-B</text><text x="346" y="350" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Отклонение</text><text x="346" y="402" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Хеш EML: разный</text><path d="M472 442L472 488" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="328" y="506" width="288" height="112" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="346" y="550" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Текстовая часть</text><text x="346" y="594" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Свой контекст</text><path d="M168 478L8 478L8 684L244 684L244 720" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><path d="M472 478L632 478L632 684L396 684L396 720" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="726" width="592" height="154" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="774" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Вложение: одинаковые байты</text><text x="44" y="822" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Один хеш содержимого</text><text x="44" y="863" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Две связи с полученными EML</text><rect x="24" y="920" width="592" height="136" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="967" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Сохраняем оба сообщения</text><text x="44" y="1012" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">Хеш не удостоверяет автора</text><text x="44" y="1046" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">DKIM в опыте не проверялся</text></svg>