<svg xmlns="http://www.w3.org/2000/svg" width="640" height="858" viewBox="0 0 640 858" role="img"><title>Состав затрат и условный кандидат на стоимость</title><desc>Суммы и основания вымышлены:900+60+90=1050,40+15=55,всего1105. Готовность20октября и мероприятие1ноября отвечают на разные вопросы.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="858" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Разделить состав, затем решить</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебные условия, не учётное решение</text><rect x="24" y="116" width="592" height="108" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="181" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#122c48">Рассмотрено: 1105</text><path d="M245 236L180 274" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><path d="M410 236L490 274" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="292" width="302" height="296" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="337" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Кандидат</text><text x="44" y="393" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#122c48">1050</text><text x="44" y="444" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Цена 900</text><text x="44" y="494" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Доставка 60</text><text x="44" y="544" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Монтаж 90</text><rect x="352" y="292" width="264" height="296" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="372" y="337" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Отдельно</text><text x="372" y="393" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#122c48">55</text><text x="372" y="444" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Обучение 40</text><text x="372" y="494" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Хранение 15</text><text x="24" y="640" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">1050 + 55 = 1105</text><rect x="24" y="680" width="592" height="148" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="725" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Готовность: 20.10</text><text x="44" y="769" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Мероприятие: 01.11</text><text x="44" y="810" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Даты отвечают на разные вопросы</text></svg>