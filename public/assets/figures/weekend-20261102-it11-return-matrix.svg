<svg xmlns="http://www.w3.org/2000/svg" width="640" height="996" viewBox="0 0 640 996" role="img"><title>Матрица приёмки и отдельное решение</title><desc>Учебная матрица: A подтверждён по трём условиям, у B неизвестна целостность. После проверки B остаётся K1; после закрытия K1 готовы предпосылки. Решение связано с конкретной версией.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="996" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Проверки и решение по версии</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Вымышленные A, B и временное право K1</text><text x="145" y="148" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Возврат</text><text x="300" y="148" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Целостн.</text><text x="457" y="148" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Сценарий</text><rect x="24" y="170" width="592" height="90" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="226" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">A</text><text x="174" y="226" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Да</text><text x="332" y="226" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Да</text><text x="496" y="226" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Да</text><rect x="24" y="278" width="592" height="90" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="334" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">B</text><text x="174" y="334" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Да</text><text x="348" y="334" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">?</text><text x="496" y="334" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Да</text><text x="24" y="414" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">? — не проверено, не «да»</text><rect x="24" y="452" width="592" height="126" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="496" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">1. Подтверждена целостность B</text><text x="44" y="548" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Узлы проверены; K1 ещё открыт</text><path d="M320 590L320 622" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="640" width="592" height="126" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="685" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">2. Закрыт K1</text><text x="44" y="737" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Заданные предпосылки выполнены</text><path d="M320 778L320 808" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="826" width="592" height="140" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="872" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">3. Отдельное решение</text><text x="44" y="918" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">По этой версии и этому периметру</text></svg>