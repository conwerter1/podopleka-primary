<svg xmlns="http://www.w3.org/2000/svg" width="640" height="996" viewBox="0 0 640 996" role="img"><title>Связи капитала, денег и неденежного события</title><desc>Учебный капитал 120 + 50 + 30 − 20 = 180, деньги 70 + 35 + 30 − 12 = 123. Невыплаченная часть 8 — отдельное обязательство. Неденежные актив 40 и обязательство 40 не являются денежными поступлением и выплатой.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="996" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">Капитал и деньги</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Две связи одной учебной компании</text><rect x="24" y="120" width="592" height="146" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="169" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Капитал: признанное распределение</text><text x="44" y="231" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">120 + 50 + 30 − 20 = 180</text><rect x="24" y="298" width="592" height="146" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="347" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Деньги: исполненная выплата</text><text x="44" y="409" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">70 + 35 + 30 − 12 = 123</text><rect x="24" y="478" width="280" height="136" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="524" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Признано 20</text><text x="44" y="578" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Не равно выплате</text><rect x="328" y="478" width="288" height="136" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="348" y="524" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Выплачено 12</text><text x="348" y="578" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Есть свой период</text><rect x="24" y="646" width="592" height="130" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="695" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#122c48">20 − 12 = 8</text><text x="44" y="745" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Остаток обязательства</text><rect x="24" y="812" width="592" height="154" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="858" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Актив +40 / обязательство +40</text><text x="44" y="906" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Без движения денег</text><text x="44" y="950" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">Не создаёт денежных +40 и −40</text></svg>