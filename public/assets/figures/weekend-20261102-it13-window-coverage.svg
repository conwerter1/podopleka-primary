<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1040" viewBox="0 0 640 1040" role="img"><title>Запуск, завершение и доказанное покрытие окна</title><desc>Вымышленные три окна: есть три запуска, но лишь W1 подтверждено по R2 и полному заданному срезу. W2 не завершено; W3 имеет старую версию и неполные данные. После исправления три результата и одна находка.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="1040" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">Запуск ≠ покрытое окно</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебные W1–W3; требуется правило R2</text><rect x="24" y="120" width="280" height="134" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="165" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Сообщения</text><text x="44" y="219" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#122c48">3 из 3</text><rect x="328" y="120" width="288" height="134" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="348" y="165" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Покрытие</text><text x="348" y="219" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#122c48">1 из 3</text><rect x="24" y="286" width="592" height="148" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="328" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">W1 — подтверждено</text><text x="44" y="374" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">R2, полный заданный срез</text><text x="44" y="415" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Завершено; результат 0</text><rect x="24" y="458" width="592" height="148" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="500" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">W2 — нет результата</text><text x="44" y="546" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Запуск был</text><text x="44" y="587" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Обработка не завершена</text><rect x="24" y="630" width="592" height="148" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="672" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">W3 — не подходит</text><text x="44" y="718" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Версия R1 вместо R2</text><text x="44" y="759" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Неполный исходный срез</text><path d="M320 816L320 850" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="868" width="592" height="142" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="915" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">После исправления: 3 окна</text><text x="44" y="960" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">1 находка требует рассмотрения</text><text x="44" y="995" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">Покрытие ≠ закрытие риска</text></svg>