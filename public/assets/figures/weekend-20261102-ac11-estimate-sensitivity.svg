<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1008" viewBox="0 0 640 1008" role="img"><title>Вероятности, оценка и отдельный временной эффект</title><desc>Вымышленные 500 случаев и два набора вероятностей дают 18000 и 24000. Разница 6000 связана с вероятностями. При отдельном условии двух лет и 5% первоначальные 18000 дают 16326,53.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="1008" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">Что изменилось в оценке?</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебные 500 случаев; расходы 0, 200, 1000</text><rect x="24" y="116" width="592" height="190" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="164" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Первый набор: 90% / 8% / 2%</text><text x="44" y="209" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">500 × (0,90 × 0 + 0,08 × 200</text><text x="44" y="252" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">+ 0,02 × 1000) = 18 000</text><rect x="24" y="334" width="592" height="174" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="382" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Новый набор: 88% / 9% / 3%</text><text x="44" y="431" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Прежние расходы и число случаев</text><text x="44" y="479" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">Оценка: 24 000</text><rect x="24" y="540" width="592" height="118" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="591" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Разница: +6 000</text><text x="44" y="636" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">Причина — структура вероятностей</text><text x="24" y="713" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Отдельно — эффект времени</text><rect x="24" y="748" width="592" height="178" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="794" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Если все 18 000 через два года</text><text x="44" y="839" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">и задана ставка 5%:</text><text x="44" y="890" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">18 000 / 1,05² = 16 326,53</text><text x="24" y="977" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Это условия опыта, не рыночный прогноз</text></svg>