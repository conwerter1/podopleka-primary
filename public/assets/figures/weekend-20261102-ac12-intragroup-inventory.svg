<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img"><title>Внутригрупповая прибыль в остатке запасов</title><desc>В учебном примере стоимость 70 и внутренняя цена 100. После внешней продажи 60% запас B 40 превышает групповую стоимость 28 на 12. Внешняя выручка 90, себестоимость 42, прибыль 48.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="950" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Внутренняя цена ≠ стоимость группы</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Вымышленные A и B; один товар и валюта</text><rect x="24" y="116" width="592" height="140" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="163" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Стоимость у A: 70</text><text x="44" y="214" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Продажа внутри группы: 100</text><text x="24" y="310" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Вовне продано 60% за 90</text><text x="24" y="356" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">В запасах остаётся 40%</text><rect x="24" y="390" width="280" height="174" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="437" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Запас у B</text><text x="44" y="491" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">40</text><text x="44" y="539" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">100 × 40%</text><rect x="328" y="390" width="288" height="174" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="348" y="437" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Для группы</text><text x="348" y="491" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">28</text><text x="348" y="539" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">70 × 40%</text><rect x="24" y="596" width="592" height="110" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="642" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">40 − 28 = 12</text><text x="44" y="683" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Исключаем внутреннюю прибыль</text><text x="24" y="760" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Контроль результата группы</text><text x="44" y="814" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Выручка: 190 − 100 = 90</text><text x="44" y="863" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Себестоимость: 130 − 100 + 12 = 42</text><text x="44" y="917" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">Прибыль: 90 − 42 = 48</text></svg>