<svg xmlns="http://www.w3.org/2000/svg" width="640" height="990" viewBox="0 0 640 990" role="img"><title>Межбазовый мост и движение корректировки</title><desc>Все суммы учебные: исходно 1000/600/400, после заданных J2/J3 — 970/620/350. Повтор J2 сохраняет ложное равенство 940=620+320. J3: начальные +20 и движение −20 дают конечный 0.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="990" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Мост и жизнь корректировки</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Активы / Обязательства / Капитал</text><rect x="24" y="116" width="592" height="100" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="177" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#122c48">1000 / 600 / 400</text><text x="44" y="266" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">J2: актив −30; капитал −30</text><text x="44" y="310" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">J3: долг +20; капитал −20</text><path d="M320 328L320 364" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="382" width="592" height="114" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="430" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Правильный учебный итог</text><text x="44" y="479" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">970 = 620 + 350</text><rect x="24" y="526" width="592" height="142" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="572" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">J2 внесена дважды</text><text x="44" y="622" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">940 = 620 + 320</text><text x="44" y="655" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Равенство не выявляет повтор</text><text x="24" y="720" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">J3: движение и конечная разница</text><rect x="24" y="756" width="172" height="146" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="40" y="802" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Начало</text><text x="40" y="866" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">+20</text><rect x="234" y="756" width="172" height="146" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="250" y="802" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Движение</text><text x="250" y="866" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">−20</text><rect x="444" y="756" width="172" height="146" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="460" y="802" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Конец</text><text x="460" y="866" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">0</text><path d="M204 832L226 832" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><path d="M414 832L436 832" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><text x="24" y="956" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Два способа сборки не складывают</text></svg>