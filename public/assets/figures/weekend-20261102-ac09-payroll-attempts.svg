<svg xmlns="http://www.w3.org/2000/svg" width="640" height="898" viewBox="0 0 640 898" role="img"><title>Начисления, удержания и попытки выплаты</title><desc>Учебно начислено240,удержано45,к выплате195. Первые80и70исполнены; перваяпопыткаC45отклонена до списания,повторная45исполнена. Суммапопыток240не равнаисполнению195.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="898" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Один долг, две попытки</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебные суммы и статусы</text><rect x="24" y="116" width="592" height="130" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="159" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Начислено 240 − удержания 45</text><text x="44" y="211" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">К выплате: 195</text><text x="24" y="300" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">A: 80 + B: 70 = 150 исполнено</text><text x="24" y="350" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Обязательство C: 45</text><rect x="24" y="386" width="264" height="196" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="432" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Попытка C1</text><text x="44" y="481" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#122c48">45</text><text x="44" y="528" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Отклонена</text><text x="44" y="568" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">до списания</text><path d="M298 484L340 484" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="352" y="386" width="264" height="196" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="372" y="432" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Попытка C2</text><text x="372" y="481" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#122c48">45</text><text x="372" y="528" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Исполнена</text><text x="24" y="638" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Все четыре попытки: 240</text><text x="24" y="685" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Три исполненные выплаты: 195</text><rect x="24" y="730" width="592" height="138" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="779" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Долг C погашен один раз</text><text x="44" y="829" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">45 по исполненной попытке</text></svg>