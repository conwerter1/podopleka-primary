<svg xmlns="http://www.w3.org/2000/svg" width="640" height="902" viewBox="0 0 640 902" role="img"><title>Приведение пересчётов к одному моменту</title><desc>А09:00наблюдались10, потом4перемещены вБ, где10:00наблюдались4. На10:00Арасчётно6,Б4,итого10.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="902" rx="16" fill="#fff"/><text x="24" y="43" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Один общий момент</text><text x="24" y="82" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебные зоны А и Б; единицы товара</text><text x="36" y="139" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">09:00</text><text x="260" y="139" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">09:30</text><text x="500" y="139" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">10:00</text><text x="24" y="193" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Зона А</text><rect x="24" y="214" width="180" height="130" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="258" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#122c48">10</text><text x="44" y="308" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">наблюд.</text><path d="M214 277L450 277" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="462" y="214" width="154" height="130" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="482" y="258" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#122c48">6</text><text x="482" y="308" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">расчёт</text><path d="M320 287L320 440" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><text x="352" y="362" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">М4: 4</text><text x="352" y="403" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">из А в Б</text><text x="24" y="449" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Зона Б</text><rect x="24" y="470" width="180" height="130" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="514" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#122c48">—</text><text x="44" y="564" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">не считали</text><path d="M214 533L450 533" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="462" y="470" width="154" height="130" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="482" y="514" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#122c48">4</text><text x="482" y="564" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">наблюд.</text><rect x="24" y="640" width="592" height="136" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="686" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#fff">На 10:00: 6 + 4 = 10</text><text x="44" y="735" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">14 — сумма разных моментов</text><text x="24" y="824" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Нужно полное подтверждение М4.</text><text x="24" y="867" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Иначе определённый итог не заявляем.</text></svg>