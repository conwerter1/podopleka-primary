<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img"><title>Два результата сопоставления</title><desc>Учебные заказ10, приёмка8 и счёт10; превышение2 остаётся различимым от решения по исключению.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="840" rx="16" fill="#fff"/><text x="24" y="43" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Один контроль — два результата</text><text x="24" y="82" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебное количественное исключение</text><rect x="24" y="112" width="176" height="124" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="42" y="153" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Заказ</text><text x="42" y="209" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">10</text><rect x="232" y="112" width="176" height="124" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="250" y="153" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Приёмка</text><text x="250" y="209" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">8</text><rect x="440" y="112" width="176" height="124" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="458" y="153" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Счёт</text><text x="458" y="209" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">10</text><path d="M320 248L320 284" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="296" width="592" height="136" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="340" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#122c48">Автоматический результат</text><text x="44" y="383" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">10 &gt; 8: превышение на 2</text><path d="M320 444L320 480" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="492" width="592" height="154" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="536" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Дальнейшее действие по политике</text><text x="44" y="580" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Удержание или отдельное разрешение</text><text x="44" y="621" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">с основанием и полномочием</text><rect x="24" y="682" width="592" height="126" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="726" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#fff">Ручное решение</text><text x="44" y="771" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">не стирает исходное расхождение</text></svg>