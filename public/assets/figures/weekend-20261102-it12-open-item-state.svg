<svg xmlns="http://www.w3.org/2000/svg" width="640" height="972" viewBox="0 0 640 972" role="img"><title>Открытая позиция после миграции</title><desc>При учебном остатке главной книги 60 закрытый счёт даёт очередь 0, открытый без связи оплаты — 100, корректно частично погашенный — 60. Это модель одного сценария, не реальная ERP.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="972" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Остаток один, состояния разные</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебный счёт I1: 100; оплата P1: 40</text><rect x="24" y="116" width="592" height="98" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="177" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">Главная книга: 100 − 40 = 60</text><rect x="24" y="252" width="592" height="168" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="299" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Счёт закрыт</text><text x="44" y="348" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">В отбор не попадает</text><text x="44" y="393" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Очередь к оплате:</text><text x="474" y="364" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">0</text><rect x="24" y="450" width="592" height="168" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="497" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Счёт открыт</text><text x="44" y="546" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Связь с P1 потеряна</text><text x="44" y="591" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Очередь к оплате:</text><text x="474" y="562" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">100</text><rect x="24" y="648" width="592" height="168" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="695" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Частично погашен</text><text x="44" y="744" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">P1 применена к I1</text><text x="44" y="789" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Очередь к оплате:</text><text x="474" y="760" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#122c48">60</text><text x="24" y="896" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Проверяйте деловой сценарий</text><text x="24" y="942" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Сумма главной книги его не заменяет</text></svg>