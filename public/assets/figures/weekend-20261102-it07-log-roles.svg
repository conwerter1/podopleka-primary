<svg xmlns="http://www.w3.org/2000/svg" width="640" height="934" viewBox="0 0 640 934" role="img"><title>Что поддерживают разные журналы</title><desc>Аутентификация, запрос, транзакция и бизнес-история отвечают на разные вопросы; в учебнойпопыткеT8зафиксированROLLBACK.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="934" rx="16" fill="#fff"/><text x="24" y="43" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Слои подтверждения</text><text x="24" y="82" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебные U7, Q8, T8 и D4</text><rect x="24" y="112" width="592" height="157" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="155" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Вход U7</text><text x="44" y="197" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Поддерживает связь с сеансом</text><text x="44" y="237" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Не доказывает согласование D4</text><path d="M320 276L320 292" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="300" width="592" height="157" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="343" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Запрос Q8</text><text x="44" y="385" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Показывает запрос приложения</text><text x="44" y="425" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Нужно знать смысл его статуса</text><path d="M320 464L320 480" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="488" width="592" height="157" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="531" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Транзакция T8: ROLLBACK</text><text x="44" y="573" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Изменение попытки отменено</text><text x="44" y="613" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">SQL-текст не заменяет исход</text><path d="M320 652L320 668" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="676" width="592" height="157" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="719" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Бизнес-история D4</text><text x="44" y="761" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">D4: состояние не изменилось</text><text x="44" y="801" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Полномочие проверяется отдельно</text><text x="24" y="899" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Вывод ограничен вопросом и периодом.</text></svg>