<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1176" viewBox="0 0 640 1176" role="img"><title>Время условия, свидетельства и разрешения выпуска</title><desc>Учебно 20X1/20X2: 20 декабря дефект, 28 декабря противоречие, 31 декабря отчётная дата, 15 января получение заключения, 10 февраля разрешение выпуска. Получение 15 февраля вне данного окна. Даты не разрешают противоречие сами.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="1176" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">Когда возникло условие?</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебное дело: 20X1 → 20X2</text><path d="M62 150L62 1004" stroke="#2161d4" stroke-width="4"/><circle cx="62" cy="166" r="11" fill="#2161d4"/><rect x="94" y="122" width="522" height="148" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="114" y="162" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">20 декабря</text><text x="114" y="210" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Отмечен возможный дефект</text><text x="114" y="251" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Нужно связать с партией</text><circle cx="62" cy="348" r="11" fill="#2161d4"/><rect x="94" y="304" width="522" height="148" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="114" y="344" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">28 декабря</text><text x="114" y="392" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Противоречащий протокол</text><text x="114" y="433" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Требуется разбор</text><circle cx="62" cy="530" r="11" fill="#2161d4"/><rect x="94" y="486" width="522" height="148" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="114" y="526" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">31 декабря</text><text x="114" y="574" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Отчётная дата</text><text x="114" y="615" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Состояние на эту дату</text><circle cx="62" cy="712" r="11" fill="#2161d4"/><rect x="94" y="668" width="522" height="148" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="114" y="708" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">15 января</text><text x="114" y="756" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Получено заключение</text><text x="114" y="797" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Не дата самого дефекта</text><circle cx="62" cy="894" r="11" fill="#2161d4"/><rect x="94" y="850" width="522" height="148" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="114" y="890" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">10 февраля</text><text x="114" y="938" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Разрешён выпуск</text><text x="114" y="979" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Граница заданного окна</text><rect x="24" y="1034" width="592" height="112" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="1079" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Получение 15 февраля</text><text x="44" y="1124" font-family="Arial, sans-serif" font-size="30" font-w