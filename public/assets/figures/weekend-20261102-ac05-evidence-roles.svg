<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img"><title>Сравнение четырёх источников подтверждения</title><desc>Договор, акт, счёт и банк помогают ответить на разные вопросы. Ни один источник не объявлен достаточным для любого вывода о выручке.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="890" rx="16" fill="#fff"/><text x="24" y="42" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Документ и вопрос проверки</text><text x="24" y="79" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Авторское сопоставление подтверждений</text><rect x="24" y="110" width="592" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="149" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Договор</text><text x="44" y="189" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Что обещано и на каких условиях?</text><text x="44" y="227" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#2161d4">Как подтверждено исполнение?</text><rect x="24" y="276" width="592" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="315" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Акт</text><text x="44" y="355" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Какой результат подтверждён?</text><text x="44" y="393" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#2161d4">Совпадает ли он с условиями?</text><rect x="24" y="442" width="592" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="481" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Счёт</text><text x="44" y="521" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Какая сумма предъявлена?</text><text x="44" y="559" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#2161d4">Каково основание этой суммы?</text><rect x="24" y="608" width="592" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="647" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Банк</text><text x="44" y="687" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Какие деньги поступили?</text><text x="44" y="725" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#2161d4">С какой сделкой связано движение?</text><text x="24" y="822" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#122c48">Достаточность зависит от утверждения</text><text x="24" y="858" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">и применимого критерия учёта</text></svg>