<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1066" viewBox="0 0 640 1066" role="img"><title>Глобальное равенство скрывает два нарушения</title><desc>Учебно: A 100/90 и B 90/100 дают общие 190/190, но разницы +10 и −10. Единица включает лицо, валюту, журнал, версию, дату. Существование X и разрешение использовать X — разные проверки. Изменение допуска не устраняет дисбаланс.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="1066" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#122c48">Где выполняется равенство?</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Вымышленные суммы одной валюты</text><rect x="24" y="124" width="592" height="120" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="171" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Общая выгрузка</text><text x="44" y="225" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#122c48">Дебет 190 = Кредит 190</text><rect x="24" y="284" width="288" height="182" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="42" y="329" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Компания A</text><text x="42" y="391" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#122c48">100 / 90</text><text x="42" y="440" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Разница +10</text><rect x="328" y="284" width="288" height="182" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="346" y="329" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Компания B</text><text x="346" y="391" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#122c48">90 / 100</text><text x="346" y="440" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Разница −10</text><rect x="24" y="508" width="592" height="154" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="553" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Задаём контрольную единицу</text><text x="44" y="603" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Лицо / валюта / журнал</text><text x="44" y="644" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Версия / дата среза</text><rect x="24" y="704" width="592" height="124" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="751" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Внешний ключ: код X существует</text><text x="44" y="798" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Не доказывает допуск для B на дату</text><rect x="24" y="870" width="592" height="166" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="916" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Разрешения v1 → v2</text><text x="44" y="963" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">Затронутые единицы проверяют</text><text x="44" y="998" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#fff">Дисбаланс сам не исчезает</text></svg>