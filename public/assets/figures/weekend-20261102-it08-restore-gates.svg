<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1025" viewBox="0 0 640 1025" role="img"><title>Пять проверок восстановления</title><desc>Сначала состав набора, затем среда, целостность, бизнес-функция и критерии срока/состояния. Непроверенные условия обозначаются как ограничения.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="1025" rx="16" fill="#fff"/><text x="24" y="42" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Что подтвердил restore-test</text><text x="24" y="79" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Авторская схема приёмки результата</text><rect x="24" y="110" width="592" height="112" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="150" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#122c48">1  Состав</text><text x="44" y="193" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Что входит в резервный набор?</text><path d="M320 227L320 249" stroke="#2161d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="252" width="592" height="112" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="292" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#122c48">2  Развёртывание</text><text x="44" y="335" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Получена подходящая среда?</text><path d="M320 369L320 391" stroke="#2161d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="394" width="592" height="112" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="434" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#122c48">3  Целостность</text><text x="44" y="477" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Данные и связи проверены?</text><path d="M320 511L320 533" stroke="#2161d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="536" width="592" height="112" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="576" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#122c48">4  Бизнес-функция</text><text x="44" y="619" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Согласованный сценарий работает?</text><path d="M320 653L320 675" stroke="#2161d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="678" width="592" height="112" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="718" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#122c48">5  Срок и точка состояния</text><text x="44" y="761" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Фактические результаты приемлемы?</text><rect x="24" y="842" width="592" height="115" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="884" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#122c48">Непроверенный этап сохраняем</text><text x="44" y="925" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">как границу вывода в отчёте</text><text x="24" y="994" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Успешное копирование — отдельный факт</text></svg>