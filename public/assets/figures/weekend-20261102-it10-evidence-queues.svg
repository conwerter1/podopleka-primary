<svg xmlns="http://www.w3.org/2000/svg" width="640" height="906" viewBox="0 0 640 906" role="img"><title>Четыре маршрута технических находок</title><desc>Четыре вымышленные карточки: A к исправлению, B к плановой обработке, C к уточнению применимости, D к проверке полноты реестра. Неизвестность не равна безопасности.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="906" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">От основания к нужной задаче</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Учебные карточки, не реальные CVE</text><rect x="24" y="126" width="264" height="144" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="165" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">A</text><text x="44" y="211" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Основания</text><text x="44" y="253" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">подтверждены</text><path d="M298 198L340 198" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="352" y="126" width="264" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="372" y="188" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Исправление</text><text x="372" y="231" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">объекта</text><rect x="24" y="300" width="264" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="339" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">B</text><text x="44" y="385" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Изоляция</text><text x="44" y="427" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">подтверждена</text><path d="M298 372L340 372" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="352" y="300" width="264" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="372" y="362" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Плановая</text><text x="372" y="405" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">обработка</text><rect x="24" y="474" width="264" height="144" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="513" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">C</text><text x="44" y="559" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Объект</text><text x="44" y="601" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">не подтверждён</text><path d="M298 546L340 546" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="352" y="474" width="264" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="372" y="536" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Уточнение</text><text x="372" y="579" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">применимости</text><rect x="24" y="648" width="264" height="144" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="687" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">D</text><text x="44" y="733" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Неполный</text><text x="44" y="775" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">реестр ПО</text><path d="M298 720L340 720" fill="none" stroke="#2161d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="352" y="648" width="264" height="144" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="372" y="710" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#122c48">Проверка</text><text x="372" y="753" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">инвентаризации</text><text x="24" y="874" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#122c48">Неизвестное ≠ безопасное</text></svg>