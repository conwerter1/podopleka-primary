<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1028" viewBox="0 0 640 1028" role="img"><title>Три набора доказательств результата ИТ</title><desc>Учебно: поставка 10 из 10 функций, использование 60 из 100 заявок, проблемные передачи 5 из 50 вместо 20 из 100. Обучение не подтверждено. Даже комплектный мост не определяет причинный вклад.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="1028" rx="16" fill="#fff"/><text x="24" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#122c48">Три разных доказательства</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Собственные учебные данные</text><rect x="24" y="120" width="592" height="158" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="162" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">1. Поставка</text><text x="44" y="216" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#122c48">10 / 10 = 100%</text><text x="44" y="260" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Функции приняты</text><rect x="24" y="306" width="592" height="158" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="348" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">2. Использование</text><text x="44" y="402" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#122c48">60 / 100 = 60%</text><text x="44" y="446" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Подходящие заявки</text><rect x="24" y="492" width="592" height="158" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="534" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">3. Проблемные передачи</text><text x="44" y="588" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#122c48">5 / 50 = 10%</text><text x="44" y="632" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Ранее: 20 / 100 = 20%</text><rect x="24" y="690" width="592" height="140" rx="12" fill="#fff1cc" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="738" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Зависимость ещё открыта</text><text x="44" y="784" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Обучение не подтверждено</text><text x="44" y="818" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#122c48">Проценты этого не исправляют</text><rect x="24" y="866" width="592" height="132" rx="12" fill="#071e36" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="914" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Разные совокупности</text><text x="44" y="962" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Комплектность ≠ причинность</text></svg>