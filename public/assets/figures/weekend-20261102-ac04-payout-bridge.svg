<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img"><title>Учебная сверка выплаты 870</title><desc>Из 1000 платежей вычитаются 100 возврата и 30 комиссии, итог 870 сопоставляется с банком. Неперечисленные 140 показаны отдельно.</desc><metadata>© 2026 Алексей Алексин и Александра Костюченко. Все права защищены.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2161d4"/></marker></defs><rect width="640" height="890" rx="16" fill="#fff"/><text x="24" y="42" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#122c48">Из чего сложилась выплата</text><text x="24" y="79" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Учебный пакет · условные единицы</text><rect x="24" y="108" width="592" height="118" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="143" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#122c48">Платежи покупателей</text><text x="44" y="180" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">10 платежей по 100</text><text x="494" y="192" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2161d4">1000</text><path d="M320 230L320 249" stroke="#2161d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="253" width="592" height="118" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="288" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#122c48">Возврат</text><text x="44" y="325" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Отдельная связанная операция</text><text x="494" y="337" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2161d4">−100</text><path d="M320 375L320 394" stroke="#2161d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="398" width="592" height="118" rx="12" fill="#f2f6fb" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="433" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#122c48">Комиссия</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">С подтверждённым основанием</text><text x="494" y="482" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2161d4">−30</text><path d="M320 520L320 539" stroke="#2161d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="543" width="592" height="118" rx="12" fill="#071e36" stroke="#071e36" stroke-width="2"/><text x="44" y="578" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">Выплата и банковская строка</text><text x="44" y="615" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#fff">Связываем по ID и реквизитам</text><text x="494" y="627" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#90ded6">870</text><rect x="24" y="710" width="592" height="112" rx="12" fill="#dcf4f1" stroke="#cbd7e4" stroke-width="2"/><text x="44" y="746" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#122c48">Ещё 140 — следующий пакет</text><text x="44" y="788" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Не включаем в эти 870</text><text x="24" y="858" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#122c48">Состав пакета и банк проверяются отдельно</text></svg>